services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped

  api:
    build: ./backend
    env_file: .env
    volumes:
      - media_data:/data
    ports:
      - "8000:8000"
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    build: ./backend
    command: sh -c 'i=0; while [ "$$i" -lt "$${MAX_CONCURRENT_DOWNLOADS:-3}" ]; do rq worker downloads --url "$$REDIS_URL" & i=$$((i+1)); done; wait'
    env_file: .env
    volumes:
      - media_data:/data
    depends_on:
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  redis_data:
  media_data:
